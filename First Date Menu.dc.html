<script type="module">
import * as THREE from 'three';

import { buildModel } from './models-3d.js';
function buildById(id) { return buildModel(id); }

/* ====================== 3D snapshot helper ======================
   One WebGL context, reused for the whole page, stamps each item's model
   to a small static PNG the first time it's needed and caches it by id.
   Cards then just show a plain <img> — no per-card renderer, no
   requestAnimationFrame loop, no live GL context to lose. A previous
   version gave every visible card its own live WebGLRenderer; browsers
   cap concurrent WebGL contexts (commonly ~8–16), and creating/destroying
   them on every scroll tick was both the stutter and the reason some
   previews silently never appeared (a context request that overflows the
   budget just fails). Rendering once to an image sidesteps both. */
const SNAP_W = 320, SNAP_H = 256;
let sharedRenderer = null;
function getSharedRenderer() {
  if (sharedRenderer) return sharedRenderer;
  sharedRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  sharedRenderer.setPixelRatio(1);
  sharedRenderer.setSize(SNAP_W, SNAP_H, false);
  sharedRenderer.toneMapping = THREE.ACESFilmicToneMapping;
  sharedRenderer.toneMappingExposure = 1.1;
  return sharedRenderer;
}

const snapshotCache = new Map(); // model id -> data URL (or null if it failed)

/* Per-shape camera framing — the old single fixed formula (fov 30, dir
   0.42/0.46/0.78, distMul 1.35, kept here as `default`) squashed tall
   glasses and left flat plates under-filled. Shape comes from SHAPE_KEY
   (defined further down, next to MODEL3D). */
const CAMERA_PROFILES = {
  default: { fov: 30, dir: [0.42, 0.46, 0.78], distMul: 1.35 },
  tall:    { fov: 24, dir: [0.30, 0.32, 0.90], distMul: 1.24 },
  glass:   { fov: 26, dir: [0.34, 0.38, 0.87], distMul: 1.26 },
  teaglass:{ fov: 27, dir: [0.36, 0.40, 0.85], distMul: 1.28 },
  slice:   { fov: 34, dir: [0.42, 0.66, 0.62], distMul: 1.30 },
  square:  { fov: 34, dir: [0.40, 0.64, 0.66], distMul: 1.30 }
};
const WIDE_ITEMS = { Serpme_Kahvalti: 1.62 }; // widest single item — needs extra pull-back

function renderSnapshot(id) {
  if (snapshotCache.has(id)) return snapshotCache.get(id);
  let url = null;
  try {
    const model = buildById(id) || buildById('Latte');
    if (model) {
      const scene = new THREE.Scene();
      const bbox = new THREE.Box3().setFromObject(model);
      const center = bbox.getCenter(new THREE.Vector3());
      const size = bbox.getSize(new THREE.Vector3());
      model.position.sub(center);
      model.position.y += size.y * 0.06;
      scene.add(model);

      const renderer = getSharedRenderer();
      const profile = CAMERA_PROFILES[SHAPE_KEY[id]] || CAMERA_PROFILES.default;
      const camera = new THREE.PerspectiveCamera(profile.fov, SNAP_W / SNAP_H, 0.005, 20);
      const radius = Math.max(size.x, size.y, size.z) * 0.62;
      const dist = radius / Math.tan((camera.fov * Math.PI / 180) / 2) * (WIDE_ITEMS[id] || profile.distMul);
      camera.position.set(dist * profile.dir[0], dist * profile.dir[1], dist * profile.dir[2]);
      camera.lookAt(0, 0, 0);

      scene.add(new THREE.HemisphereLight(0xF6E3D2, 0x2A1A14, 1.15));
      const key = new THREE.DirectionalLight(0xFFF1DF, 2.5);
      key.position.set(0.4, 0.7, 0.5); scene.add(key);
      const fill = new THREE.DirectionalLight(0xE9A6A2, 0.85);
      fill.position.set(-0.6, 0.25, -0.4); scene.add(fill);
      const rimL = new THREE.DirectionalLight(0xE0A45C, 1.15);
      rimL.position.set(-0.25, 0.5, -0.8); scene.add(rimL);

      renderer.render(scene, camera);
      url = renderer.domElement.toDataURL('image/png');
      scene.traverse(o => { if (o.isMesh && o.geometry) o.geometry.dispose(); });
    }
  } catch (e) { console.error('[snapshot]', id, e); }
  snapshotCache.set(id, url);
  return url;
}

function mountFig(container, id) {
  const url = renderSnapshot(id);
  if (!url || container.firstChild) return;
  const img = document.createElement('img');
  img.src = url;
  img.alt = '';
  img.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:contain';
  container.appendChild(img);
}

};
function modelKeyFor(id) {
  if (isCatId(id)) return CATMODEL[id];
  const dash = id.lastIndexOf('-');
  const catId = id.slice(0, dash), idx = +id.slice(dash + 1);
  const cat = CATS.find(c => c.id === catId);
  const it = cat && cat.items[idx];
  return it && MODEL3D[it.name];
}

/* Animated cut-gesture hint — shown fresh on the first card of every
   screen (categories on load/return, items on entering a category) so
   the swipe-to-cut affordance is always taught, not just once ever.
   Disappears the moment any card on that screen gets cut. */
function swipeHintHTML(radius) {
  return `<div data-swipe-hint style="position:absolute;inset:0;border-radius:${radius}px;overflow:hidden;pointer-events:none">
    <div style="position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:radial-gradient(circle,rgba(244,234,224,.95),rgba(244,234,224,0) 70%);animation:fd-hint-move 2.6s ease-in-out .6s infinite"></div>
  </div>`;
}

function catsViewHTML() {
  const cards = CATS.map((c, i) => {
    const view = { name: c.name, note: c.note };
    const inDelay = (i * 0.06) + 's', bobDelay = (i * 0.7) + 's';
    const bob = CONFIG.floating === false ? 'paused' : 'running';
    const halfStyle = `position:absolute;inset:0;transition:transform .55s cubic-bezier(.2,.85,.25,1),opacity .55s ease;border-radius:20px;background:linear-gradient(158deg,#2A1B16 0%,#1C1310 100%);border:1px solid rgba(224,164,92,.3);box-shadow:0 18px 40px -24px rgba(0,0,0,.9);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;padding:16px 16px 22px;text-align:center`;
    const swipeHint = i === 0 ? swipeHintHTML(20) : '';
    return `
    <div data-cat-wrap="${c.id}" style="position:relative;height:224px;overflow:hidden;border-radius:20px;animation:fd-in .5s ease-out both;animation-delay:${inDelay}">
      <div style="position:absolute;inset:0;border-radius:20px;background:linear-gradient(160deg,#3A241D,#22140F);border:1px solid rgba(233,166,162,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px">
        <div style="font-family:'Instrument Serif',serif;font-size:30px;color:#E9A6A2">${c.items.length}</div>
        <div style="font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:rgba(244,234,224,.55)">ürün</div>
      </div>
      <div style="position:absolute;inset:0;animation:fd-bob 6.5s ease-in-out infinite;animation-delay:${bobDelay};animation-play-state:${bob}">
        <div data-cat-half="${c.id}" data-idx="0" style="${halfStyle};clip-path:inset(0 0 50% 0);transform:none;opacity:1">${catHalfContent(view)}</div>
        <div data-cat-half="${c.id}" data-idx="1" style="${halfStyle};clip-path:inset(50% 0 0 0);transform:none;opacity:1">${catHalfContent(view)}</div>
        <div data-fig="${c.id}" style="position:absolute;left:0;right:0;top:12px;height:122px;transform:none;opacity:1;transition:transform .55s cubic-bezier(.2,.85,.25,1),opacity .5s ease;pointer-events:none">
          <div data-fig-slot="${c.id}" style="position:absolute;inset:0"></div>
          <div style="position:absolute;left:30%;right:30%;bottom:2px;height:10px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.5),transparent)"></div>
        </div>
      </div>
      ${swipeHint}
    </div>`;
  }).join('');
  return `
  <div style="display:flex;flex-direction:column;align-items:center;gap:26px;padding:18px 18px 0">
    <p style="margin:0;max-width:340px;text-align:center;font-size:14px;line-height:1.6;color:rgba(244,234,224,.62);text-wrap:pretty">Menüyü açmak için parmağınla kartın üstünden hızlıca kaydır. Kesilen kategori sana içindekileri gösterir.</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;width:100%;max-width:760px">${cards}</div>
  </div>`;
}

function itemsViewHTML(catId) {
  const cat = CATS.find(c => c.id === catId);
  const showPrice = CONFIG.revealPrices === true;
  const hint = showPrice ? 'kesip aç' : 'fiyat için kes';
  const cards = cat.items.map((it, i) => {
    const id = cat.id + '-' + i;
    const view = { name: it.name, capTxt: showPrice ? (it.price + ' ₺') : it.teaser };
    const inDelay = (i * 0.05) + 's', bobDelay = (i * 0.55) + 's';
    const bob = CONFIG.floating === false ? 'paused' : 'running';
    const halfStyle = `position:absolute;inset:0;transition:transform .55s cubic-bezier(.2,.85,.25,1),opacity .55s ease;border-radius:16px;background:linear-gradient(158deg,#241814 0%,#191110 100%);border:1px solid rgba(244,234,224,.14);box-shadow:0 16px 34px -22px rgba(0,0,0,.9);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;padding:14px 14px 20px;text-align:center`;
    const swipeHint = i === 0 ? swipeHintHTML(16) : '';
    return `
    <div data-item-wrap="${id}" style="position:relative;height:248px;overflow:hidden;border-radius:16px;animation:fd-in .45s ease-out both;animation-delay:${inDelay}">
      <div style="position:absolute;inset:0;border-radius:16px;background:linear-gradient(150deg,#4A2C22,#26160F);border:1px solid rgba(224,164,92,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px;text-align:center">
        <div style="font-size:14px;font-weight:500;line-height:1.25;text-wrap:balance">${it.name}</div>
        <div style="font-family:'Instrument Serif',serif;font-size:38px;color:#E0A45C;line-height:1">${it.price} ₺</div>
        <div style="font-size:12px;line-height:1.45;color:rgba(244,234,224,.6);text-wrap:pretty">${it.desc}</div>
      </div>
      <div style="position:absolute;inset:0;animation:fd-bob 5.5s ease-in-out infinite;animation-delay:${bobDelay};animation-play-state:${bob}">
        <div data-item-half="${id}" data-idx="0" style="${halfStyle};clip-path:inset(0 0 50% 0);transform:none;opacity:1">${itemHalfContent(view)}</div>
        <div data-item-half="${id}" data-idx="1" style="${halfStyle};clip-path:inset(50% 0 0 0);transform:none;opacity:1">${itemHalfContent(view)}</div>
        <div data-fig="${id}" style="position:absolute;left:0;right:0;top:10px;height:116px;transform:none;opacity:1;transition:transform .55s cubic-bezier(.2,.85,.25,1),opacity .5s ease;pointer-events:none">
          <div data-fig-slot="${id}" style="position:absolute;inset:0"></div>
          <div style="position:absolute;left:30%;right:30%;bottom:2px;height:9px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.5),transparent)"></div>
        </div>
      </div>
      ${swipeHint}
    </div>`;
  }).join('');
  return `
  <div style="display:flex;flex-direction:column;align-items:center;gap:20px;padding:14px 18px 0">
    <div style="display:flex;align-items:center;gap:14px;width:100%;max-width:760px">
      <div id="back-btn" style="cursor:pointer;flex:none;white-space:nowrap;display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;border:1px solid rgba(244,234,224,.2);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:rgba(244,234,224,.75)">← Menü</div>
      <div style="flex:1;text-align:right">
        <div style="font-family:'Instrument Serif',serif;font-size:26px;line-height:1.1">${cat.name}</div>
        <div style="font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:rgba(244,234,224,.42)">${hint}</div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:14px;width:100%;max-width:760px">${cards}</div>
  </div>`;
}

/* ====================== app state / interaction ====================== */
const state = { view: 'cats', cat: null, sliced: {} };
const wrapRefs = new Map();
const halfRefs = new Map();
const figRefs = new Map();      // id -> outer floating-figure wrapper (transform/opacity + bob pause)
const figSlotRefs = new Map();  // id -> inner snapshot-<img> mount target
const mainEl = document.getElementById('app-main');

function bindCatsRefs() {
  wrapRefs.clear(); halfRefs.clear(); figRefs.clear(); figSlotRefs.clear();
  mainEl.querySelectorAll('[data-cat-wrap]').forEach(el => wrapRefs.set(el.dataset.catWrap, el));
  mainEl.querySelectorAll('[data-cat-half]').forEach(el => {
    const id = el.dataset.catHalf, idx = +el.dataset.idx;
    const arr = halfRefs.get(id) || []; arr[idx] = el; halfRefs.set(id, arr);
  });
  mainEl.querySelectorAll('[data-fig]').forEach(el => figRefs.set(el.dataset.fig, el));
  mainEl.querySelectorAll('[data-fig-slot]').forEach(el => figSlotRefs.set(el.dataset.figSlot, el));
}
function bindItemsRefs() {
  wrapRefs.clear(); halfRefs.clear(); figRefs.clear(); figSlotRefs.clear();
  mainEl.querySelectorAll('[data-item-wrap]').forEach(el => wrapRefs.set(el.dataset.itemWrap, el));
  mainEl.querySelectorAll('[data-item-half]').forEach(el => {
    const id = el.dataset.itemHalf, idx = +el.dataset.idx;
    const arr = halfRefs.get(id) || []; arr[idx] = el; halfRefs.set(id, arr);
  });
  mainEl.querySelectorAll('[data-fig]').forEach(el => figRefs.set(el.dataset.fig, el));
  mainEl.querySelectorAll('[data-fig-slot]').forEach(el => figSlotRefs.set(el.dataset.figSlot, el));
  const backBtn = document.getElementById('back-btn');
  if (backBtn) {
    const goBack = () => { state.view = 'cats'; state.cat = null; state.sliced = {}; render(); };
    // Belt-and-suspenders: the whole page has its own pointer-drag "slicing" layer
    // (touch-action:pan-y on #app-root), so don't rely on native click synthesis alone.
    // Pointer capture keeps pointerup targeted on the button even if a touch
    // drifts a few px between press and release (common on phones) — without
    // it, a drifted pointerup fires on whatever's now underneath instead of
    // the button, so goBack() silently never runs.
    backBtn.addEventListener('pointerdown', e => {
      e.stopPropagation();
      try { backBtn.setPointerCapture(e.pointerId); } catch (err) {}
    });
    backBtn.addEventListener('pointerup', e => { e.stopPropagation(); goBack(); });
  }
}

function isCatId(id) { return CATS.some(c => c.id === id); }

/* Every card's floating figure is a cached static snapshot (see
   renderSnapshot/mountFig above) — cheap enough to just mount them all
   right after a render, no viewport windowing needed. */
function mountAllFigs() {
  figSlotRefs.forEach((slot, id) => {
    const modelKey = modelKeyFor(id);
    if (modelKey) mountFig(slot, modelKey);
  });
}

let catTransitionTimer = null;

function render() {
  if (catTransitionTimer) { clearTimeout(catTransitionTimer); catTransitionTimer = null; }
  if (state.view === 'cats') {
    mainEl.innerHTML = catsViewHTML();
    bindCatsRefs();
  } else {
    mainEl.innerHTML = itemsViewHTML(state.cat);
    bindItemsRefs();
  }
  mountAllFigs();
}

function hideSwipeHint() {
  const hintEl = mainEl.querySelector('[data-swipe-hint]');
  if (hintEl) hintEl.remove();
}

function slice(id) {
  if (state.sliced[id]) return;
  state.sliced[id] = true;
  hideSwipeHint();
  const big = isCatId(id);
  const dy = big ? 76 : 68, dx = big ? 24 : 20;
  const pair = halfRefs.get(id);
  if (pair) {
    // pointer-events:none once cut — an opacity:0 half otherwise still sits
    // there and can intercept taps meant for whatever's underneath or
    // nearby (e.g. the back button, if the fly-apart animation swings a
    // first-row card up toward the header).
    if (pair[0]) { pair[0].style.transform = `translate(${-dx}px,${-dy}px) rotate(-8deg)`; pair[0].style.opacity = '0'; pair[0].style.pointerEvents = 'none'; }
    if (pair[1]) { pair[1].style.transform = `translate(${dx}px,${dy}px) rotate(7deg)`; pair[1].style.opacity = '0'; pair[1].style.pointerEvents = 'none'; }
  }
  const fig = figRefs.get(id);
  if (fig) {
    fig.style.transform = 'translateY(-34px) scale(.86) rotate(-6deg)';
    fig.style.opacity = '0';
    if (fig.parentElement) fig.parentElement.style.animationPlayState = 'paused';
  }
  if (big) {
    if (catTransitionTimer) clearTimeout(catTransitionTimer);
    catTransitionTimer = setTimeout(() => {
      catTransitionTimer = null;
      state.view = 'items'; state.cat = id; state.sliced = {};
      render();
    }, 480);
  }
}

/* pointer slicing */
let dragging = false, pts = [], fadeRaf = null;
const bladeEl = document.getElementById('blade-line');
function paint() { if (bladeEl) bladeEl.setAttribute('points', pts.map(p => p[0] + ',' + p[1]).join(' ')); }
function fadeStep() {
  fadeRaf = null;
  if (dragging) return;
  if (pts.length) { pts.shift(); paint(); fadeRaf = requestAnimationFrame(fadeStep); }
}
function hitsRect(a, b, r) {
  const inside = p => p[0] >= r.left && p[0] <= r.right && p[1] >= r.top && p[1] <= r.bottom;
  if (inside(a) || inside(b)) return true;
  const seg = (p1, p2, p3, p4) => {
    const d = (x1, y1, x2, y2, x3, y3) => (y3 - y1) * (x2 - x1) - (x3 - x1) * (y2 - y1);
    const d1 = d(p3[0], p3[1], p4[0], p4[1], p1[0], p1[1]);
    const d2 = d(p3[0], p3[1], p4[0], p4[1], p2[0], p2[1]);
    const d3 = d(p1[0], p1[1], p2[0], p2[1], p3[0], p3[1]);
    const d4 = d(p1[0], p1[1], p2[0], p2[1], p4[0], p4[1]);
    return ((d1 > 0) !== (d2 > 0)) && ((d3 > 0) !== (d4 > 0));
  };
  const c = [[r.left, r.top], [r.right, r.top], [r.right, r.bottom], [r.left, r.bottom]];
  for (let i = 0; i < 4; i++) if (seg(a, b, c[i], c[(i + 1) % 4])) return true;
  return false;
}
function onDown(e) { dragging = true; pts = [[e.clientX, e.clientY]]; paint(); }
function onMove(e) {
  if (!dragging) return;
  const p = [e.clientX, e.clientY];
  const prev = pts[pts.length - 1];
  pts.push(p);
  if (pts.length > 16) pts.shift();
  paint();
  if (!prev) return;
  if (Math.hypot(p[0] - prev[0], p[1] - prev[1]) < 4) return;
  for (const [id, el] of wrapRefs) {
    if (state.sliced[id]) continue;
    if (!el || !el.isConnected) continue;
    const r = el.getBoundingClientRect();
    const pad = 10;
    if (hitsRect(prev, p, { left: r.left + pad, right: r.right - pad, top: r.top + pad, bottom: r.bottom - pad })) {
      slice(id);
      if (isCatId(id)) break; // one category transition per swipe — avoids a race between two pending view switches
    }
  }
}
function onUp() { if (!dragging) return; dragging = false; if (!fadeRaf) fadeRaf = requestAnimationFrame(fadeStep); }

const root = document.getElementById('app-root');
root.addEventListener('pointerdown', onDown);
root.addEventListener('pointermove', onMove);
root.addEventListener('pointerup', onUp);
root.addEventListener('pointercancel', onUp);
root.addEventListener('pointerleave', onUp);

document.getElementById('footer-address').textContent = CONFIG.address;
const igEl = document.getElementById('footer-ig');
igEl.textContent = CONFIG.instagram;
igEl.href = 'https://instagram.com/' + CONFIG.instagram.replace('@', '');

render();
</script>
</body>
</html>
