<script type="module">
import * as THREE from 'three';

/* ====================== models.js (inlined) ====================== */
const FACTS = [];
const reg = (f) => { FACTS.push(f); return f; };

const P = (x, y) => new THREE.Vector2(x, y);
let seed = 20260901;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const rr = (a, b) => a + rnd() * (b - a);

const MATS = {};
function mat(name, color, o = {}) {
  if (!MATS[name]) MATS[name] = new THREE.MeshStandardMaterial({ name, color, roughness: 0.55, ...o });
  return MATS[name];
}
function glassMat(name, color, opacity, extra = {}) {
  if (!MATS[name]) MATS[name] = new THREE.MeshPhysicalMaterial({
    name, color, roughness: 0.07, metalness: 0, transparent: true, opacity,
    transmission: 0.5, thickness: 0.006, side: THREE.DoubleSide, clearcoat: 0.6, ...extra
  });
  return MATS[name];
}

const PORSELEN = mat('porselen', 0xF7F4EF, { roughness: 0.22, metalness: 0.04, side: THREE.DoubleSide });
const CAM      = glassMat('cam', 0xE4F0EE, 0.30, { transmission: 0.72, thickness: 0.005, roughness: 0.045, ior: 1.48, clearcoat: 0.9, depthWrite: false });
const CAM_KENAR= glassMat('cam_kenar', 0xF4FBF9, 0.62, { transmission: 0.28, thickness: 0.002, roughness: 0.04, clearcoat: 1, depthWrite: true });
const BUZ      = glassMat('buz', 0xE6F5FB, 0.86, { transmission: 0.1, roughness: 0.12, clearcoat: 0.9 });
const CELIK    = mat('celik', 0xC9CCD0, { roughness: 0.25, metalness: 0.35 });
const AHSAP    = mat('ahsap', 0x8A6136, { roughness: 0.68 });
const KREMA    = mat('krema', 0xFFFBF2, { roughness: 0.8 });
const KOPUK    = mat('sut_kopugu', 0xFBF3E4, { roughness: 0.78 });
const KAKAO    = mat('kakao_tozu', 0x5A3A22, { roughness: 0.92 });
const CIKOLATA = mat('cikolata', 0x4B2A17, { roughness: 0.42 });
const NANE     = mat('nane', 0x336B2C, { roughness: 0.52, side: THREE.DoubleSide });
const EKMEK    = mat('ekmek', 0xD3A059, { roughness: 0.82 });
const EKMEK_IC = mat('ekmek_ici', 0xF1E1BC, { roughness: 0.86 });
const KIZARMIS = mat('kizarmis', 0xC9822F, { roughness: 0.74 });
const PEYNIR   = mat('peynir', 0xF6E6B0, { roughness: 0.6 });
const KASAR    = mat('kasar', 0xF0C24E, { roughness: 0.55 });
const DOMATES  = mat('domates', 0xC2321F, { roughness: 0.45 });
const SALATALIK= mat('salatalik', 0x6E9B41, { roughness: 0.5 });
const ZEYTIN   = mat('zeytin', 0x3A3B22, { roughness: 0.4 });
const SARISI   = mat('yumurta_sarisi', 0xE9A72B, { roughness: 0.4 });
const AKI      = mat('yumurta_aki', 0xFAF4E6, { roughness: 0.55 });
const FRAMBUAZ = mat('frambuaz', 0xA31A32, { roughness: 0.36 });
const TAVUK    = mat('tavuk', 0xC98B3C, { roughness: 0.76 });
const MARUL    = mat('marul', 0x5C8A31, { roughness: 0.6, side: THREE.DoubleSide });

const nm = (m, n) => { m.name = n; return m; };
const box = (w, h, d, m, n) => nm(new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m), n);
const cyl = (rt, rb, h, m, n, s = 32) => nm(new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, s), m), n);
const sph = (r, m, n, s = 20) => nm(new THREE.Mesh(new THREE.SphereGeometry(r, s, Math.round(s * 0.7)), m), n);

function tabak(r, name, m = PORSELEN, thin = false) {
  const t = thin ? 0.004 : 0.005;
  const pts = [P(0, 0), P(r * 0.48, 0), P(r * 0.78, t * 1.4), P(r * 0.95, t * 3.2), P(r, t * 4.2),
               P(r, t * 5), P(r * 0.92, t * 4), P(r * 0.72, t * 2.2), P(r * 0.48, t), P(0, t)];
  return nm(new THREE.Mesh(new THREE.LatheGeometry(pts, 56), m), name);
}

const CUP = [[0,0],[0.023,0],[0.0255,0.004],[0.029,0.018],[0.0355,0.045],[0.0415,0.070],[0.0430,0.074],
             [0.0400,0.074],[0.0330,0.045],[0.0265,0.018],[0.0215,0.007],[0,0.007]];
function cupMesh(rTop, h, base, name, m = PORSELEN) {
  const sx = rTop / 0.043, sy = h / 0.074;
  return nm(new THREE.Mesh(new THREE.LatheGeometry(CUP.map(([x, y]) => P(x * sx, base + y * sy)), 56), m), name);
}

const TEA = [[0,0],[0.0165,0],[0.0180,0.0035],[0.0135,0.0180],[0.0112,0.0300],[0.0135,0.0420],
             [0.0195,0.0580],[0.0245,0.0720],[0.0268,0.0790],
             [0.0250,0.0790],[0.0228,0.0720],[0.0178,0.0580],[0.0118,0.0420],[0.0095,0.0300],
             [0.0118,0.0180],[0.0160,0.0060],[0,0.0060]];
const TEA_LIQ = [[0,0.0062],[0.0150,0.0062],[0.0111,0.0180],[0.0089,0.0300],[0.0111,0.0420],
                 [0.0167,0.0580],[0.0205,0.0690],[0,0.0690]];
function teaGlass(name, liqColor) {
  const g = new THREE.Group(); g.name = name;
  g.add(nm(new THREE.Mesh(new THREE.LatheGeometry(TEA.map(([x, y]) => P(x, y)), 56), CAM), `${name}_govde`));
  const rim = nm(new THREE.Mesh(new THREE.TorusGeometry(0.0259, 0.0011, 10, 56), CAM_KENAR), `${name}_agiz`);
  rim.rotation.x = Math.PI / 2; rim.position.y = 0.0790; g.add(rim);
  if (liqColor) {
    const lm = mat(`${name}_sivi`, liqColor, { roughness: 0.14, transparent: true, opacity: 0.95 });
    g.add(nm(new THREE.Mesh(new THREE.LatheGeometry(TEA_LIQ.map(([x, y]) => P(x, y)), 48), lm), `${name}_cay`));
  }
  return g;
}

function straightGlass(r, h, name, m = CAM) {
  const g = new THREE.Group(); g.name = name;
  const pts = [P(0,0), P(r*0.86,0), P(r*0.93,0.004), P(r*0.95,0.012), P(r,h*0.8), P(r,h),
               P(r-0.0028,h), P(r-0.0030,h*0.8), P(r*0.90,0.012), P(r*0.80,0.008), P(0,0.008)];
  g.add(nm(new THREE.Mesh(new THREE.LatheGeometry(pts, 56), m), `${name}_govde`));
  const rim = nm(new THREE.Mesh(new THREE.TorusGeometry(r - 0.0014, 0.0016, 10, 56), CAM_KENAR), `${name}_agiz`);
  rim.rotation.x = Math.PI / 2; rim.position.y = h; g.add(rim);
  const foot = nm(new THREE.Mesh(new THREE.TorusGeometry(r * 0.90, 0.0018, 10, 48), CAM_KENAR), `${name}_taban`);
  foot.rotation.x = Math.PI / 2; foot.position.y = 0.002; g.add(foot);
  return g;
}

function stemGlass(name, bowl) {
  const g = new THREE.Group(); g.name = name;
  const pts = [P(0,0), P(0.031,0), P(0.032,0.004), P(0.006,0.010), P(0.0045,0.055)];
  bowl.forEach(([x, y]) => pts.push(P(x, y)));
  g.add(nm(new THREE.Mesh(new THREE.LatheGeometry(pts, 56), CAM), `${name}_govde`));
  let rx = 0, ry = 0;
  bowl.forEach(([x, y]) => { if (y > ry || (y === ry && x > rx)) { rx = Math.max(rx, x); ry = Math.max(ry, y); } });
  const rim = nm(new THREE.Mesh(new THREE.TorusGeometry(rx - 0.0012, 0.0015, 10, 56), CAM_KENAR), `${name}_agiz`);
  rim.rotation.x = Math.PI / 2; rim.position.y = ry; g.add(rim);
  const foot = nm(new THREE.Mesh(new THREE.TorusGeometry(0.0295, 0.0018, 10, 48), CAM_KENAR), `${name}_taban`);
  foot.rotation.x = Math.PI / 2; foot.position.y = 0.002; g.add(foot);
  return g;
}

function ice(g, n, rad, y0, y1, size = 0.017) {
  for (let i = 0; i < n; i++) {
    const a = rnd() * Math.PI * 2, d = rr(0, rad);
    const c = box(size, size, size, BUZ, `buz_${i}`);
    c.position.set(Math.cos(a) * d, rr(y0, y1), Math.sin(a) * d);
    c.rotation.set(rr(0, 3), rr(0, 3), rr(0, 3));
    g.add(c);
  }
}

function wheel(r, name, kabuk, ic) {
  const g = new THREE.Group(); g.name = name;
  g.add(cyl(r, r, 0.0052, kabuk, `${name}_kabuk`, 40));
  g.add(cyl(r * 0.88, r * 0.88, 0.0058, ic, `${name}_ic`, 40));
  for (let s = 0; s < 8; s++) {
    const a = (s / 8) * Math.PI * 2;
    const seg = box(r * 0.86, 0.006, 0.0009, kabuk, `${name}_bolme_${s}`);
    seg.position.set(Math.cos(a) * r * 0.44, 0, Math.sin(a) * r * 0.44);
    seg.rotation.y = -a;
    g.add(seg);
  }
  return g;
}
const LIME_K = mat('lime_kabugu', 0x5E8F1E, { roughness: 0.48 });
const LIME_I = mat('lime_ici', 0xD9E88F, { roughness: 0.42 });
const LMN_K  = mat('limon_kabugu', 0xE8C33B, { roughness: 0.45 });
const LMN_I  = mat('limon_ici', 0xF5E9A6, { roughness: 0.42 });
const PRT_K  = mat('portakal_kabugu', 0xE2751A, { roughness: 0.5 });
const PRT_I  = mat('portakal_ici', 0xF3A73B, { roughness: 0.45 });

function leafMesh(name, s = 1) {
  const shape = new THREE.Shape();
  shape.moveTo(0, 0);
  shape.bezierCurveTo(0.008, 0.006, 0.010, 0.020, 0, 0.030);
  shape.bezierCurveTo(-0.010, 0.020, -0.008, 0.006, 0, 0);
  const g = new THREE.ExtrudeGeometry(shape, { depth: 0.0007, bevelEnabled: false, curveSegments: 14 });
  const m = nm(new THREE.Mesh(g, NANE), name);
  m.scale.setScalar(s);
  return m;
}

function mintSprig(name, x, y, z, n = 5) {
  const g = new THREE.Group(); g.name = name;
  for (let i = 0; i < n; i++) {
    const l = leafMesh(`${name}_yaprak_${i}`, rr(0.8, 1.1));
    l.position.set(rr(-0.012, 0.008), rr(-0.006, 0.014), rr(-0.012, 0.012));
    l.rotation.set(rr(-0.5, 0.5), rnd() * 6.28, rr(-0.6, 0.6));
    g.add(l);
  }
  g.position.set(x, y, z);
  return g;
}

function whip(name, r, y, m = KREMA) {
  const g = new THREE.Group(); g.name = name;
  const turns = 4;
  for (let i = 0; i < turns; i++) {
    const t = i / turns;
    const rr2 = r * (1 - t * 0.62);
    const tube = r * (0.30 - t * 0.13);
    const ring = nm(new THREE.Mesh(new THREE.TorusGeometry(rr2 - tube, tube, 14, 40), m), `${name}_burgu_${i}`);
    ring.rotation.x = Math.PI / 2;
    ring.scale.y = 0.8;
    ring.position.set(Math.cos(i * 2.0) * r * 0.05, y + t * r * 1.15 + tube * 0.4, Math.sin(i * 2.0) * r * 0.05);
    g.add(ring);
  }
  const tip = cyl(0.0009, r * 0.20, r * 0.55, m, `${name}_uc`, 14);
  tip.position.y = y + r * 1.30;
  tip.rotation.z = 0.18;
  g.add(tip);
  return g;
}

function mug({ name, rTop = 0.043, h = 0.074, liq = 0x8A5A33, foam = null, art = false,
               dust = null, saucer = 0.079, cupMat = PORSELEN, topping = null }) {
  const g = new THREE.Group(); g.name = name;
  const base = saucer ? 0.0045 : 0;
  if (saucer) g.add(tabak(saucer, `${name}_tabak`));
  g.add(cupMesh(rTop, h, base, `${name}_fincan`, cupMat));
  const hd = nm(new THREE.Mesh(new THREE.TorusGeometry(rTop * 0.44, 0.0048, 16, 40, Math.PI * 1.55), cupMat), `${name}_kulp`);
  hd.position.set(rTop * 0.84, base + h * 0.62, 0);
  hd.rotation.z = -Math.PI * 0.42;
  g.add(hd);
  const surfY = base + h * 0.885, rS = rTop * 0.875;
  const liqM = mat(`${name}_sivi`, liq, { roughness: 0.42 });
  const body = cyl(rS, rTop * 0.6, h * 0.62, liqM, `${name}_icecek`, 40);
  body.position.y = surfY - h * 0.31;
  g.add(body);
  if (foam) {
    const f = cyl(rS, rS, 0.006, foam === true ? KOPUK : mat(`${name}_kopuk`, foam, { roughness: 0.8 }), `${name}_kopuk`, 40);
    f.position.y = surfY + 0.002;
    g.add(f);
    const dome = sph(rS * 0.92, foam === true ? KOPUK : mat(`${name}_kopuk`, foam, { roughness: 0.8 }), `${name}_kopuk_kubbe`, 24);
    dome.scale.y = 0.22; dome.position.y = surfY + 0.005;
    g.add(dome);
  }
  if (art) {
    const a = new THREE.Group(); a.name = `${name}_latte_art`;
    for (let i = 0; i < 7; i++) {
      const t = i / 6, r = rS * (0.78 - t * 0.58);
      const l = nm(new THREE.Mesh(new THREE.TorusGeometry(r, 0.0022, 8, 32, Math.PI * 0.95), KOPUK), `${name}_art_${i}`);
      l.rotation.order = 'YXZ'; l.rotation.x = -Math.PI / 2; l.rotation.y = Math.PI * 0.525;
      l.position.set(-rS * 0.5 + t * rS * 1.1, 0, 0);
      a.add(l);
    }
    const tip = sph(0.005, KOPUK, `${name}_art_uc`, 18);
    tip.scale.set(1.5, 0.3, 1.1); tip.position.x = -rS * 0.62;
    a.add(tip);
    a.position.y = surfY + 0.0015; a.rotation.y = 0.4;
    g.add(a);
  }
  if (dust) {
    const d = cyl(rS * 0.72, rS * 0.72, 0.0012, mat(`${name}_toz`, dust, { roughness: 0.95 }), `${name}_toz`, 36);
    d.position.y = surfY + (foam ? 0.010 : 0.0016);
    g.add(d);
  }
  if (topping) topping(g, surfY, rS, name);
  return g;
}

function cayBardagi({ name, liq, garnish = null }) {
  const g = new THREE.Group(); g.name = name;
  g.add(tabak(0.048, `${name}_tabak`));
  const gl = teaGlass(`${name}_bardak`, liq); gl.position.y = 0.0045; g.add(gl);
  const spoon = new THREE.Group(); spoon.name = `${name}_kasik`;
  const sb = nm(new THREE.Mesh(new THREE.SphereGeometry(0.0058, 22, 14, 0, Math.PI * 2, Math.PI * 0.5, Math.PI * 0.5), CELIK), `${name}_kasik_bas`);
  sb.scale.set(1, 0.40, 1.5); sb.position.set(0, 0.0022, 0.015); spoon.add(sb);
  const sh = cyl(0.0014, 0.0019, 0.028, CELIK, `${name}_kasik_sap`, 10);
  sh.rotation.x = Math.PI / 2; sh.position.set(0, 0.0022, -0.006); spoon.add(sh);
  spoon.position.set(0.030, 0.0105, 0.019); spoon.rotation.set(0.04, -Math.PI / 6, 0.09);
  g.add(spoon);
  if (garnish) garnish(g, name);
  return g;
}

function uzunBardak({ name, r = 0.034, h = 0.132, liq, layers = null, iceN = 5, straw = null,
                      rimWheel = null, mint = false, whipTop = false, coaster = false,
                      crema = null, bubbles = false }) {
  const g = new THREE.Group(); g.name = name;
  let y0 = 0;
  if (coaster) { const c = cyl(0.052, 0.051, 0.006, AHSAP, `${name}_altlik`, 48); c.position.y = 0.003; g.add(c); y0 = 0.006; }
  const gl = straightGlass(r, h, `${name}_bardak`); gl.position.y = y0; g.add(gl);
  const top = h * 0.82;
  if (layers) {
    let cur = 0.008;
    layers.forEach(([color, frac], i) => {
      const hh = (top - 0.008) * frac;
      const m = mat(`${name}_kat_${i}`, color, { roughness: 0.16, transparent: true, opacity: 0.97 });
      const c = cyl(r - 0.0048, r - 0.0058, hh, m, `${name}_katman_${i}`, 44);
      c.position.y = y0 + cur + hh / 2; cur += hh;
      g.add(c);
    });
  } else {
    const m = mat(`${name}_sivi`, liq, { roughness: 0.16, transparent: true, opacity: 0.96 });
    const c = cyl(r - 0.0048, r - 0.0058, top - 0.008, m, `${name}_icecek`, 44);
    c.position.y = y0 + 0.008 + (top - 0.008) / 2;
    g.add(c);
  }
  if (crema) {
    const f = cyl(r - 0.0048, r - 0.0048, 0.006, mat(`${name}_crema`, crema, { roughness: 0.72 }), `${name}_crema`, 44);
    f.position.y = y0 + top - 0.003; g.add(f);
    const dome = sph((r - 0.0048) * 0.94, mat(`${name}_crema`, crema, { roughness: 0.72 }), `${name}_crema_kubbe`, 22);
    dome.scale.y = 0.16; dome.position.y = y0 + top; g.add(dome);
  }
  if (bubbles) {
    const bg = new THREE.Group(); bg.name = `${name}_kabarciklar`;
    for (let i = 0; i < 26; i++) {
      const b = sph(rr(0.0011, 0.0024), BUZ, `${name}_kabarcik_${i}`, 8);
      const a = rnd() * 6.283, d = rr(0, r - 0.006);
      b.position.set(Math.cos(a) * d, y0 + rr(0.014, top - 0.008), Math.sin(a) * d);
      bg.add(b);
    }
    g.add(bg);
  }
  if (iceN) { const ig = new THREE.Group(); ig.name = `${name}_buzlar`; ice(ig, iceN, r * 0.42, y0 + 0.02, y0 + top - 0.014); g.add(ig);
    const dg = new THREE.Group(); dg.name = `${name}_yogusma`;
    const dropM = glassMat('yogusma', 0xFFFFFF, 0.55, { transmission: 0.7, roughness: 0.05, depthWrite: false });
    for (let i = 0; i < 24; i++) {
      const d = sph(rr(0.0013, 0.0026), dropM, `${name}_damla_${i}`, 8);
      const a = rnd() * 6.283;
      d.position.set(Math.cos(a) * (r + 0.0006), y0 + rr(0.014, h * 0.92), Math.sin(a) * (r + 0.0006));
      d.scale.set(0.65, 1.5, 0.65);
      dg.add(d);
    }
    g.add(dg);
  }

    s.position.set(0.011, y0 + h * 0.72, -0.008); s.rotation.z = -0.18;

  if (rimWheel) {
    const w = wheel(0.019, `${name}_dilim`, rimWheel[0], rimWheel[1]);
    w.position.set(r - 0.003, y0 + h, 0.004);

function dilim({ name, ic, ustRenk, kenar, R = 0.072, ANG = 1.0, H = 0.048, plateR = 0.105, garnish = null }) {
  const g = new THREE.Group(); g.name = name;
  g.add(tabak(plateR, `${name}_tabak`));
  const y0 = 0.005;
  const sh = new THREE.Shape();
  sh.moveTo(0, 0); sh.lineTo(R, 0); sh.absarc(0, 0, R, 0, ANG, false); sh.lineTo(0, 0);
  const mk = (depth, m, n) => {
    const geo = new THREE.ExtrudeGeometry(sh, { depth, bevelEnabled: true, bevelSize: 0.0014, bevelThickness: 0.0014, bevelSegments: 2, curveSegments: 40 });
    geo.rotateX(-Math.PI / 2);
    return nm(new THREE.Mesh(geo, m), n);
  };
  const inner = new THREE.Group();
  const bodyH = H - 0.006;
  const b = mk(bodyH, mat(`${name}_ic`, ic, { roughness: 0.66 }), `${name}_govde`);
  b.position.y = y0; inner.add(b);
  if (kenar) {
    const CT = 0.0022;
    const cs = new THREE.Shape();
    cs.moveTo(R, 0); cs.absarc(0, 0, R, 0, ANG, false);
    cs.lineTo((R + CT) * Math.cos(ANG), (R + CT) * Math.sin(ANG));
    cs.absarc(0, 0, R + CT, ANG, 0, true); cs.lineTo(R, 0);
    const cg = new THREE.ExtrudeGeometry(cs, { depth: bodyH + 0.003, bevelEnabled: false, curveSegments: 48 });
    cg.rotateX(-Math.PI / 2);
    const cm = nm(new THREE.Mesh(cg, mat(`${name}_kenar`, kenar, { roughness: 0.58 })), `${name}_dis_kabuk`);
    cm.position.y = y0; inner.add(cm);
  }
  if (ustRenk) {
    const t = mk(0.006, mat(`${name}_ust`, ustRenk, { roughness: 0.5 }), `${name}_ust_yuzey`);
    t.position.y = y0 + bodyH - 0.001;
    const pos = t.geometry.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const y = pos.getY(i);
      if (y > 0.0055) {
        const x = pos.getX(i), z = pos.getZ(i), d = Math.hypot(x, z);
        pos.setY(i, y + Math.sin(d * 145) * 0.0007 + Math.sin(x * 95 + z * 70) * 0.0006 - d * 0.004);
      }
    }
    pos.needsUpdate = true; t.geometry.computeVertexNormals();
    inner.add(t);
  }
  inner.position.set(-R * 0.55, 0, R * 0.30);
  const slice = new THREE.Group(); slice.name = `${name}_dilim`;
  slice.add(inner); slice.rotation.y = -2.3;
  g.add(slice);
  if (garnish) garnish(g, name, y0);
  return g;
}

function frambuazTanesi(name, x, y, z) {
  const b = new THREE.Group(); b.name = name;
  for (let j = 0; j < 12; j++) {
    const a = (j / 12) * Math.PI * 2, ring = j % 2 === 0 ? 0.0054 : 0.0041;
    const d = sph(0.0029, FRAMBUAZ, `${name}_tane_${j}`, 12);
    d.position.set(Math.cos(a) * ring, (j % 2) * 0.0031 + 0.0021, Math.sin(a) * ring);
    b.add(d);
  }
  const cap = sph(0.0033, FRAMBUAZ, `${name}_tepe`, 12); cap.position.y = 0.006; b.add(cap);
  b.position.set(x, y, z);
  return b;
}

function tostDilim(name, fillings) {
  const shape = new THREE.Shape();
  shape.moveTo(-0.042, 0); shape.lineTo(0.042, 0); shape.lineTo(-0.042, 0.058); shape.lineTo(-0.042, 0);
  const geo = new THREE.ExtrudeGeometry(shape, { depth: 0.010, bevelEnabled: false });
  geo.rotateX(-Math.PI / 2);
  const g = new THREE.Group(); g.name = name;
  let y = 0;
  const stack = [[EKMEK, 0.010], ...fillings, [EKMEK, 0.010]];
  const CX = -0.0093, CZ = -0.0193, K = 0.93;
  stack.forEach(([m, h], i) => {
    const geo2 = new THREE.ExtrudeGeometry(shape, { depth: h, bevelEnabled: false });
    geo2.rotateX(-Math.PI / 2);
    const s = nm(new THREE.Mesh(geo2, m), `${name}_kat_${i}`);
    const bread = (i === 0 || i === stack.length - 1);
    if (bread) { s.position.y = y; }
    else { s.scale.set(K, 1, K); s.position.set(CX * (1 - K), y, CZ * (1 - K)); }
    g.add(s); y += h;
  });
  return g;
}

function buildById(id) {
  const i = ORDER.indexOf(id);
  return i >= 0 && FACTS[i] ? FACTS[i]() : null;
}

/* ====================== 3D snapshot helper ======================
   One WebGL context, reused for the whole page, stamps each item's model
   to a small static PNG the first time it's needed and caches it by id.
   Cards then just show a plain <img> — no per-card renderer, no
   requestAnimationFrame loop, no live GL context to lose. A previous
   version gave every visible card its own live WebGLRenderer; browsers
   cap concurrent WebGL contexts (commonly ~8–16), and creating/destroying
   them on every scroll tick was both the stutter and the reason some
   previews silently never appeared (a context request that overflows the
   budget just fails). Rendering once to an image sidesteps both. */
const SNAP_W = 320, SNAP_H = 256;
let sharedRenderer = null;
function getSharedRenderer() {
  if (sharedRenderer) return sharedRenderer;
  sharedRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  sharedRenderer.setPixelRatio(1);
  sharedRenderer.setSize(SNAP_W, SNAP_H, false);
  sharedRenderer.toneMapping = THREE.ACESFilmicToneMapping;
  sharedRenderer.toneMappingExposure = 1.1;
  return sharedRenderer;
}

const snapshotCache = new Map(); // model id -> data URL (or null if it failed)

function renderSnapshot(id) {
  if (snapshotCache.has(id)) return snapshotCache.get(id);
  let url = null;
  try {
    const model = buildById(id) || buildById('Latte');
    if (model) {
      const scene = new THREE.Scene();
      const bbox = new THREE.Box3().setFromObject(model);
      const center = bbox.getCenter(new THREE.Vector3());
      const size = bbox.getSize(new THREE.Vector3());
      model.position.sub(center);
      model.position.y += size.y * 0.06;
      scene.add(model);

      const renderer = getSharedRenderer();
      const camera = new THREE.PerspectiveCamera(30, SNAP_W / SNAP_H, 0.005, 20);
      const radius = Math.max(size.x, size.y, size.z) * 0.62;
      const dist = radius / Math.tan((camera.fov * Math.PI / 180) / 2) * 1.35;
      camera.position.set(dist * 0.42, dist * 0.46, dist * 0.78);
      camera.lookAt(0, 0, 0);

      scene.add(new THREE.HemisphereLight(0xF6E3D2, 0x2A1A14, 1.15));
      const key = new THREE.DirectionalLight(0xFFF1DF, 2.5);
      key.position.set(0.4, 0.7, 0.5); scene.add(key);
      const fill = new THREE.DirectionalLight(0xE9A6A2, 0.85);
      fill.position.set(-0.6, 0.25, -0.4); scene.add(fill);
      const rimL = new THREE.DirectionalLight(0xE0A45C, 1.15);
      rimL.position.set(-0.25, 0.5, -0.8); scene.add(rimL);

      renderer.render(scene, camera);
      url = renderer.domElement.toDataURL('image/png');
      scene.traverse(o => { if (o.isMesh && o.geometry) o.geometry.dispose(); });
    }
  } catch (e) { console.error('[snapshot]', id, e); }
  snapshotCache.set(id, url);
  return url;
}

function mountFig(container, id) {
  const url = renderSnapshot(id);
  if (!url || container.firstChild) return;
  const img = document.createElement('img');
  img.src = url;
  img.alt = '';
  img.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:contain';
  container.appendChild(img);
}

function lighten(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const ch = [n >> 16 & 255, n >> 8 & 255, n & 255].map(v => Math.round(v + (255 - v) * amt));
  return 'rgb(' + ch.join(',') + ')';
}
function vessel(catId, i, name) {

  const v = VESSELS[look[0]] || VESSELS[VAR[catId] || 'mug'];
  const c = look[1];
  return {
    vh: v.vh, clip: v.clip, br: v.br, c: c,
    rim: lighten(c, 0.32), rimEdge: lighten(c, 0.5),
    handle: !!v.handle, steam: !!v.steam, straw: !!v.straw, stem: !!v.stem,
    hasRim: !v.norim, dish: !!v.dish,
    noModel: !(name && MODEL3D[name])
  };
}
function modelKeyFor(id) {
  if (isCatId(id)) return CATMODEL[id];
  const dash = id.lastIndexOf('-');
  const catId = id.slice(0, dash), idx = +id.slice(dash + 1);
  const cat = CATS.find(c => c.id === catId);
  const it = cat && cat.items[idx];
  return it && MODEL3D[it.name];
}

function vesselHTML(v, big) {
  const W = big ? 62 : 54;
  const mb = big ? 6 : 4;
  const steamTop1 = big ? -22 : -20, steamTop2 = big ? -26 : -24, steamH = big ? 22 : 20;
  const strawTop = big ? -16 : -14, strawW = big ? 6 : 5, strawH = big ? 46 : 40;
  const handleRight = big ? -13 : -11, handleW = big ? 22 : 19, handleH = big ? 28 : 24;
  const rimH = big ? 15 : 13, dishH = big ? 14 : 13, dishInset = big ? 14 : 16;
  const stemBaseH = big ? 9 : 8;
  const shadowBottom = big ? -9 : -8, shadowH = big ? 11 : 10;

  let html = `<div style="position:relative;width:${W}px;height:${v.vh};flex:none;margin-bottom:${mb}px">`;
  if (v.steam) {
    html += `<div style="position:absolute;left:32%;top:${steamTop1}px;width:4px;height:${steamH}px;border-radius:3px;background:linear-gradient(rgba(244,234,224,0),rgba(244,234,224,.5));animation:fd-steam 3.2s ease-in-out infinite"></div>`;
    html += `<div style="position:absolute;left:56%;top:${steamTop2}px;width:4px;height:${steamH}px;border-radius:3px;background:linear-gradient(rgba(244,234,224,0),rgba(244,234,224,.4));animation:fd-steam 3.2s ease-in-out .9s infinite"></div>`;
  }
  if (v.straw) {
    html += `<div style="position:absolute;left:56%;top:${strawTop}px;width:${strawW}px;height:${strawH}px;border-radius:3px;background:linear-gradient(90deg,#F0BDB8,#B96A6A);transform:rotate(14deg);transform-origin:bottom center"></div>`;
  }
  html += `<div style="position:absolute;inset:0;animation:fd-turn 8s ease-in-out infinite;animation-play-state:${CONFIG.floating ? 'running' : 'paused'}">`;
  if (v.handle) {
    html += `<div style="position:absolute;right:${handleRight}px;top:24%;width:${handleW}px;height:${handleH}px;border:4px solid ${v.rim};border-left-color:transparent;border-radius:50%"></div>`;
  }
  html += `<div style="position:absolute;inset:0;clip-path:${v.clip};border-radius:${v.br};background:linear-gradient(90deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.12) 20%,rgba(255,255,255,.32) 38%,rgba(0,0,0,.16) 70%,rgba(0,0,0,.5) 100%),${v.c}"></div>`;
  if (v.hasRim) {
    html += `<div style="position:absolute;top:-3px;left:9%;right:9%;height:${rimH}px;border-radius:50%;background:radial-gradient(60% 70% at 42% 30%,${v.rimEdge},${v.rim});box-shadow:inset 0 -3px 5px rgba(0,0,0,.4)"></div>`;
  }
  if (v.dish) {
    html += `<div style="position:absolute;left:-${dishInset}%;right:-${dishInset}%;bottom:6%;height:${dishH}px;border-radius:50%;background:linear-gradient(180deg,#F1E4D6,#9C8B7C);box-shadow:0 6px 10px -6px rgba(0,0,0,.8)"></div>`;
  }
  if (v.stem) {
    html += `<div style="position:absolute;left:calc(50% - 3px);top:58%;width:6px;height:30%;background:linear-gradient(90deg,rgba(0,0,0,.45),${v.rim},rgba(0,0,0,.45))"></div>`;
    html += `<div style="position:absolute;left:26%;right:26%;bottom:-3px;height:${stemBaseH}px;border-radius:50%;background:linear-gradient(180deg,${v.rim},rgba(0,0,0,.5))"></div>`;
  }
  html += `</div>`;
  html += `<div style="position:absolute;left:4%;right:4%;bottom:${shadowBottom}px;height:${shadowH}px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.6),transparent)"></div>`;
  html += `</div>`;
  return html;
}

    const inDelay = (i * 0.05) + 's', bobDelay = (i * 0.55) + 's';
    const bob = CONFIG.floating === false ? 'paused' : 'running';
    const halfStyle = `position:absolute;inset:0;transition:transform .55s cubic-bezier(.2,.85,.25,1),opacity .55s ease;border-radius:16px;background:linear-gradient(158deg,#241814 0%,#191110 100%);border:1px solid rgba(244,234,224,.14);box-shadow:0 16px 34px -22px rgba(0,0,0,.9);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;padding:14px 14px 20px;text-align:center`;
    return `
    <div data-item-wrap="${id}" style="position:relative;height:248px;animation:fd-in .45s ease-out both;animation-delay:${inDelay}">
      <div style="position:absolute;inset:0;border-radius:16px;background:linear-gradient(150deg,#4A2C22,#26160F);border:1px solid rgba(224,164,92,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px;text-align:center">
        <div style="font-size:14px;font-weight:500;line-height:1.25;text-wrap:balance">${it.name}</div>
        <div style="font-family:'Instrument Serif',serif;font-size:38px;color:#E0A45C;line-height:1">${it.price} ₺</div>
        <div style="font-size:12px;line-height:1.45;color:rgba(244,234,224,.6);text-wrap:pretty">${it.desc}</div>
      </div>
      <div style="position:absolute;inset:0;animation:fd-bob 5.5s ease-in-out infinite;animation-delay:${bobDelay};animation-play-state:${bob}">
        <div data-item-half="${id}" data-idx="0" style="${halfStyle};clip-path:inset(0 0 50% 0);transform:none;opacity:1">${itemHalfContent(view)}</div>
        <div data-item-half="${id}" data-idx="1" style="${halfStyle};clip-path:inset(50% 0 0 0);transform:none;opacity:1">${itemHalfContent(view)}</div>
        <div data-fig="${id}" style="position:absolute;left:0;right:0;top:10px;height:116px;transform:none;opacity:1;transition:transform .55s cubic-bezier(.2,.85,.25,1),opacity .5s ease;pointer-events:none">
          <div data-fig-slot="${id}" style="position:absolute;inset:0"></div>
          <div style="position:absolute;left:30%;right:30%;bottom:2px;height:9px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.5),transparent)"></div>
        </div>
      </div>
    </div>`;
  }).join('');
  return `
  <div style="display:flex;flex-direction:column;align-items:center;gap:20px;padding:14px 18px 0">
    <div style="display:flex;align-items:center;gap:14px;width:100%;max-width:760px">
      <div id="back-btn" style="cursor:pointer;flex:none;white-space:nowrap;display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;border:1px solid rgba(244,234,224,.2);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:rgba(244,234,224,.75)">← Menü</div>
      <div style="flex:1;text-align:right">
        <div style="font-family:'Instrument Serif',serif;font-size:26px;line-height:1.1">${cat.name}</div>
        <div style="font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:rgba(244,234,224,.42)">${hint}</div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:14px;width:100%;max-width:760px">${cards}</div>
  </div>`;
}

/* ====================== app state / interaction ====================== */
const state = { view: 'cats', cat: null, sliced: {} };
const wrapRefs = new Map();
const halfRefs = new Map();
const figRefs = new Map();      // id -> outer floating-figure wrapper (transform/opacity + bob pause)
const figSlotRefs = new Map();  // id -> inner snapshot-<img> mount target
const mainEl = document.getElementById('app-main');

function bindCatsRefs() {
  wrapRefs.clear(); halfRefs.clear(); figRefs.clear(); figSlotRefs.clear();
  mainEl.querySelectorAll('[data-cat-wrap]').forEach(el => wrapRefs.set(el.dataset.catWrap, el));
  mainEl.querySelectorAll('[data-cat-half]').forEach(el => {
    const id = el.dataset.catHalf, idx = +el.dataset.idx;
    const arr = halfRefs.get(id) || []; arr[idx] = el; halfRefs.set(id, arr);
  });
  mainEl.querySelectorAll('[data-fig]').forEach(el => figRefs.set(el.dataset.fig, el));
  mainEl.querySelectorAll('[data-fig-slot]').forEach(el => figSlotRefs.set(el.dataset.figSlot, el));
}
function bindItemsRefs() {
  wrapRefs.clear(); halfRefs.clear(); figRefs.clear(); figSlotRefs.clear();
  mainEl.querySelectorAll('[data-item-wrap]').forEach(el => wrapRefs.set(el.dataset.itemWrap, el));
  mainEl.querySelectorAll('[data-item-half]').forEach(el => {
    const id = el.dataset.itemHalf, idx = +el.dataset.idx;
    const arr = halfRefs.get(id) || []; arr[idx] = el; halfRefs.set(id, arr);
  });
  mainEl.querySelectorAll('[data-fig]').forEach(el => figRefs.set(el.dataset.fig, el));
  mainEl.querySelectorAll('[data-fig-slot]').forEach(el => figSlotRefs.set(el.dataset.figSlot, el));
  const backBtn = document.getElementById('back-btn');
  if (backBtn) {
    const goBack = () => { state.view = 'cats'; state.cat = null; state.sliced = {}; render(); };
    // Belt-and-suspenders: the whole page has its own pointer-drag "slicing" layer
    // (touch-action:pan-y on #app-root), so don't rely on native click synthesis alone.
    backBtn.addEventListener('pointerdown', e => e.stopPropagation());
    backBtn.addEventListener('pointerup', e => { e.stopPropagation(); goBack(); });
  }
}

function isCatId(id) { return CATS.some(c => c.id === id); }

/* Every card's floating figure is a cached static snapshot (see
   renderSnapshot/mountFig above) — cheap enough to just mount them all
   right after a render, no viewport windowing needed. */
function mountAllFigs() {
  figSlotRefs.forEach((slot, id) => {
    const modelKey = modelKeyFor(id);
    if (modelKey) mountFig(slot, modelKey);
  });
}

let catTransitionTimer = null;

function render() {
  if (catTransitionTimer) { clearTimeout(catTransitionTimer); catTransitionTimer = null; }
  if (state.view === 'cats') {
    mainEl.innerHTML = catsViewHTML();
    bindCatsRefs();
  } else {
    mainEl.innerHTML = itemsViewHTML(state.cat);
    bindItemsRefs();
  }
  mountAllFigs();
}

function slice(id) {
  if (state.sliced[id]) return;
  state.sliced[id] = true;
  const big = isCatId(id);
  const dy = big ? 76 : 68, dx = big ? 24 : 20;
  const pair = halfRefs.get(id);
  if (pair) {
    if (pair[0]) { pair[0].style.transform = `translate(${-dx}px,${-dy}px) rotate(-8deg)`; pair[0].style.opacity = '0'; }
    if (pair[1]) { pair[1].style.transform = `translate(${dx}px,${dy}px) rotate(7deg)`; pair[1].style.opacity = '0'; }
  }
  const fig = figRefs.get(id);
  if (fig) {
    fig.style.transform = 'translateY(-34px) scale(.86) rotate(-6deg)';
    fig.style.opacity = '0';
    if (fig.parentElement) fig.parentElement.style.animationPlayState = 'paused';
  }
  if (big) {
    if (catTransitionTimer) clearTimeout(catTransitionTimer);
    catTransitionTimer = setTimeout(() => {
      catTransitionTimer = null;
      state.view = 'items'; state.cat = id; state.sliced = {};
      render();
    }, 480);
  }
}

/* pointer slicing */
let dragging = false, pts = [], fadeRaf = null;
const bladeEl = document.getElementById('blade-line');
function paint() { if (bladeEl) bladeEl.setAttribute('points', pts.map(p => p[0] + ',' + p[1]).join(' ')); }
function fadeStep() {
  fadeRaf = null;
  if (dragging) return;
  if (pts.length) { pts.shift(); paint(); fadeRaf = requestAnimationFrame(fadeStep); }
}
function hitsRect(a, b, r) {
  const inside = p => p[0] >= r.left && p[0] <= r.right && p[1] >= r.top && p[1] <= r.bottom;
  if (inside(a) || inside(b)) return true;
  const seg = (p1, p2, p3, p4) => {
    const d = (x1, y1, x2, y2, x3, y3) => (y3 - y1) * (x2 - x1) - (x3 - x1) * (y2 - y1);
    const d1 = d(p3[0], p3[1], p4[0], p4[1], p1[0], p1[1]);
    const d2 = d(p3[0], p3[1], p4[0], p4[1], p2[0], p2[1]);
    const d3 = d(p1[0], p1[1], p2[0], p2[1], p3[0], p3[1]);
    const d4 = d(p1[0], p1[1], p2[0], p2[1], p4[0], p4[1]);
    return ((d1 > 0) !== (d2 > 0)) && ((d3 > 0) !== (d4 > 0));
  };
  const c = [[r.left, r.top], [r.right, r.top], [r.right, r.bottom], [r.left, r.bottom]];
  for (let i = 0; i < 4; i++) if (seg(a, b, c[i], c[(i + 1) % 4])) return true;
  return false;
}
function onDown(e) { dragging = true; pts = [[e.clientX, e.clientY]]; paint(); }
function onMove(e) {
  if (!dragging) return;
  const p = [e.clientX, e.clientY];
  const prev = pts[pts.length - 1];
  pts.push(p);
  if (pts.length > 16) pts.shift();
  paint();
  if (!prev) return;
  if (Math.hypot(p[0] - prev[0], p[1] - prev[1]) < 4) return;
  for (const [id, el] of wrapRefs) {
    if (state.sliced[id]) continue;
    if (!el || !el.isConnected) continue;
    const r = el.getBoundingClientRect();
    const pad = 10;
    if (hitsRect(prev, p, { left: r.left + pad, right: r.right - pad, top: r.top + pad, bottom: r.bottom - pad })) {
      slice(id);
      if (isCatId(id)) break; // one category transition per swipe — avoids a race between two pending view switches
    }
  }
}
function onUp() { if (!dragging) return; dragging = false; if (!fadeRaf) fadeRaf = requestAnimationFrame(fadeStep); }

const root = document.getElementById('app-root');
root.addEventListener('pointerdown', onDown);
root.addEventListener('pointermove', onMove);
root.addEventListener('pointerup', onUp);
root.addEventListener('pointercancel', onUp);
root.addEventListener('pointerleave', onUp);

document.getElementById('footer-address').textContent = CONFIG.address;
const igEl = document.getElementById('footer-ig');
igEl.textContent = CONFIG.instagram;
igEl.href = 'https://instagram.com/' + CONFIG.instagram.replace('@', '');

render();
</script>
</body>
</html>
