  #back-link{position:fixed;top:16px;left:16px;z-index:10;display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;border:1px solid rgba(244,234,224,.2);background:rgba(20,14,12,.72);backdrop-filter:blur(6px);color:rgba(244,234,224,.85);font:500 12.5px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;text-decoration:none}

<body>
<a id="back-link" href="First%20Date%20Menu.dc.html">← Menü</a>
<three-d-stage name="menu-3d" background="#1B1210" hide-toolbar></three-d-stage>
<script src="./three-d-stage.js"></script>
<script type="module">
import * as THREE from 'three';
import { buildAllModels } from './models-3d.js';
const stage = document.querySelector('three-d-stage');
await stage.ready;

const items = buildAllModels();

// ---------- yerleşim ----------
const ROWS = [7, 6, 5, 4, 7, 5, 6, 5, 6];
const SX = 0.34, SZ = 0.34;
const model = new THREE.Group(); model.name = 'Menu_3D';
let idx = 0;
ROWS.forEach((count, r) => {
  const w = (count - 1) * SX;
  for (let c = 0; c < count && idx < items.length; c++, idx++) {
    const o = items[idx];
    o.position.set(-w / 2 + c * SX, 0, -((ROWS.length - 1) * SZ) / 2 + r * SZ);
    model.add(o);
  }
});
while (idx < items.length) { const o = items[idx]; o.position.set(idx * SX, 0, ROWS.length * SZ * 0.5); model.add(o); idx++; }

model.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
stage.setObject(model);

// kadraj: ızgarayı ekranda ortala ve doldur
const cam = stage._camera, ctl = stage._controls;
function fitCamera() {
  if (!cam || !ctl) return;
  const bb = new THREE.Box3().setFromObject(model);
  const corners = [];
  for (let i = 0; i < 8; i++) corners.push(new THREE.Vector3(
    (i & 1) ? bb.max.x : bb.min.x, (i & 2) ? bb.max.y : bb.min.y, (i & 4) ? bb.max.z : bb.min.z));
  const sp = bb.getBoundingSphere(new THREE.Sphere());
  const dir = new THREE.Vector3(0.55, 0.76, 1.0).normalize();
  const target = sp.center.clone();
  let dist = (sp.radius / Math.tan((cam.fov * Math.PI) / 360)) * 0.9;
  const FILL = 1.72; // NDC genişliği (toplam 2)
  for (let it = 0; it < 14; it++) {
    cam.position.copy(target).addScaledVector(dir, dist);
    cam.lookAt(target);
    cam.near = Math.max(dist / 200, 0.01); cam.far = dist * 14;
    cam.updateMatrixWorld(true); cam.updateProjectionMatrix();
    let minx = 1e9, maxx = -1e9, miny = 1e9, maxy = -1e9;
    for (const p of corners) {
      const q = p.clone().project(cam);
      minx = Math.min(minx, q.x); maxx = Math.max(maxx, q.x);
      miny = Math.min(miny, q.y); maxy = Math.max(maxy, q.y);
    }
    const cx = (minx + maxx) / 2, cy = (miny + maxy) / 2;
    const halfH = Math.tan((cam.fov * Math.PI) / 360) * dist;
    const halfW = halfH * cam.aspect;
    const right = new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 0);
    const up = new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 1);
    target.addScaledVector(right, cx * halfW).addScaledVector(up, cy * halfH);
    dist *= Math.max((maxx - minx) / FILL, (maxy - miny) / FILL);
  }
  cam.position.copy(target).addScaledVector(dir, dist);
  cam.near = Math.max(dist / 200, 0.01); cam.far = dist * 14;
  cam.updateProjectionMatrix();
  ctl.target.copy(target); ctl.update();
}
fitCamera();
let fitOnce = true;
addEventListener('resize', () => { if (fitOnce) fitCamera(); }, { passive: true });
ctl && ctl.addEventListener('start', () => { fitOnce = false; });
</script>
